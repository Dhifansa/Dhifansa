<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#367BF0" stop-opacity="0"/>
      <stop offset="1" stop-color="#367BF0" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="box"><rect x="0" y="0" width="800" height="270" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#box)">
