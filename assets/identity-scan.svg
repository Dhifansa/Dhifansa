    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="400" y="22" fill="#8b949e" font-family="monospace" font-size="13" text-anchor="middle">dhifansa@kali: ~</text>

    <text x="30" y="64" fill="#367BF0" font-family="monospace" font-size="16">┌──(dhifansa㉿kali)-[~]</text>
    <text x="30" y="86" fill="#367BF0" font-family="monospace" font-size="16">└─$ <tspan fill="#c9d1d9">./scan --identity</tspan> <tspan fill="#367BF0">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

    <g font-family="monospace" font-size="16">
      <text x="30" y="124" fill="#8b949e">name</text>      <text x="140" y="124" fill="#c9d1d9">: Dhifansa Pradibtya Rafi</text>
      <text x="30" y="150" fill="#8b949e">role</text>      <text x="140" y="150" fill="#c9d1d9">: Information Systems Student | Software Developer</text>
      <text x="30" y="176" fill="#8b949e">campus</text>    <text x="140" y="176" fill="#c9d1d9">: Universitas Negeri Semarang</text>
      <text x="30" y="202" fill="#8b949e">focus</text>     <text x="140" y="202" fill="#c9d1d9">: Full-Stack Development, Software Engineering</text>
      <text x="30" y="228" fill="#8b949e">exploring</text> <text x="140" y="228" fill="#c9d1d9">: AI integration &amp; intelligent applications</text>
      <text x="30" y="254" fill="#8b949e">status</text>    <text x="140" y="254" fill="#27c93f">: always learning</text>
    </g>

    <g>
